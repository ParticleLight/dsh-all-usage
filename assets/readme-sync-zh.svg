<svg xmlns="http://www.w3.org/2000/svg" lang="zh-CN" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="sync-zh-title sync-zh-desc">
<title id="sync-zh-title">历史与实时数据流</title>
