name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: Release tag to verify, for example v1.1.3
        required: true
        type: string
      target_sha:
        description: Full commit SHA referenced by target_tag
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

# A delayed release event and a manual recovery dispatch must not race.
concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.target_tag }}

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.target_tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install development dependencies
        run: npm ci --ignore-scripts
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.target_tag }}
          TARGET_SHA: ${{ github.event_name == 'release' && github.sha || inputs.target_sha }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          test -n "$RELEASE_TAG"
          test -n "$TARGET_SHA"
          test "$RELEASE_TAG" = "v$version"
          actual_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$actual_sha" = "$tag_sha"
          test "$actual_sha" = "$TARGET_SHA"
          echo "Release tag $RELEASE_TAG at $actual_sha matches $name@$version"

      - name: Publish npm package
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version --json >/dev/null 2>&1; then
            echo "::notice::${name}@${version} is already published; skipping duplicate publication."
            exit 0
          fi
          npm publish --access public --provenance

      - name: Verify npm publication
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          published="$(npm view "${name}@${version}" version --json)"
          node -e 'const expected = process.argv[1]; const actual = JSON.parse(process.argv[2]); if (actual !== expected) throw new Error(`npm returned ${actual}, expected ${expected}`)' "$version" "$published"
