name: CI

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      checkout_ref:
        description: Optional ref to verify, such as the release tag or the dispatching branch
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install development dependencies
        run: npm ci --ignore-scripts
      - name: Verify generated client bundle
        run: |
          git ls-files --error-unmatch lib/client.js
          npm run build:client
          git diff --exit-code -- lib/client.js
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check lib/index.js
          node --check lib/client.js
          node --check src/client.js
          node --check lib/plugin.js
          node --check lib/aggregation.js
          node --check lib/ledger.js
          node --check lib/session-sync.js
          node --check lib/pricing-runtime.js
          node --check lib/balance.js
          node --check lib/http.js
          node --check lib/pricing.js
          node --check lib/usage-core.js
          node --check scripts/build-client.mjs
          node --check scripts/check-package.mjs
          node --check scripts/replay-fixture.mjs
      - name: Check npm package contents
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/dsh-all-usage-pack.json"
          node scripts/check-package.mjs "$RUNNER_TEMP/dsh-all-usage-pack.json"

  runtime-smoke:
    name: DSH ${{ matrix.dsh-version }} / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
        dsh-version: ['0.2.1-rc.1', '0.2.1-alpha.2', '0.2.0-rc.2', '0.1.7-rc.2', '0.1.5-rc.2', '0.1.5-rc.1', '0.1.1-rc.2', '0.1.1-rc.1']
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install exact DSH Cordis runtime dependencies
        id: runtime-install
        env:
          RUNTIME_VERSION: ${{ matrix.dsh-version }}
        run: |
          set -euo pipefail
          # Cordis and its loader/timer move with the DSH runtime line; keep the
          # pairing in step with RUNTIME_PROFILES in test/dsh-runtime.test.js.
          # @deepseek-ai/dsh-settings is the settings seam and is installed for
          # every line. 0.1.7 replaced the file-backed provider with that seam
          # alone, so dsh-settings-file exists only up to 0.1.5.
          case "$RUNTIME_VERSION" in
            0.2.1-alpha.2) CORDIS_VERSION=4.0.5-alpha.1; LOADER_VERSION=1.0.6-alpha.1; TIMER_VERSION=1.1.7-alpha.1; SETTINGS_FILE_PACKAGE= ;;
            0.2.1-rc.1) CORDIS_VERSION=4.0.5; LOADER_VERSION=1.0.6; TIMER_VERSION=1.1.7; SETTINGS_FILE_PACKAGE= ;;
            0.2.0-rc.2) CORDIS_VERSION=4.0.4; LOADER_VERSION=1.0.5; TIMER_VERSION=1.1.6; SETTINGS_FILE_PACKAGE= ;;
            0.1.7-rc.*) CORDIS_VERSION=4.0.4; LOADER_VERSION=1.0.5; TIMER_VERSION=1.1.6; SETTINGS_FILE_PACKAGE= ;;
            0.1.5-rc.*) CORDIS_VERSION=4.0.2; LOADER_VERSION=1.0.3; TIMER_VERSION=1.1.4; SETTINGS_FILE_PACKAGE="@deepseek-ai/dsh-settings-file@${RUNTIME_VERSION}" ;;
            *)          CORDIS_VERSION=4.0.1; LOADER_VERSION=1.0.2; TIMER_VERSION=1.1.3; SETTINGS_FILE_PACKAGE="@deepseek-ai/dsh-settings-file@${RUNTIME_VERSION}" ;;
          esac
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 1000
          npm config set fetch-retry-maxtimeout 30000
          test "$(npm view "@deepseek-ai/dsh@${RUNTIME_VERSION}" version)" = "$RUNTIME_VERSION"
          runtime="$RUNNER_TEMP/dsh-runtime"
          mkdir -p "$runtime"
          printf '{"private":true}\n' > "$runtime/package.json"
          install_log="$RUNNER_TEMP/dsh-runtime-install.log"
          install_ok=false
          for attempt in 1 2 3; do
            if npm install --prefix "$runtime" --no-save --package-lock=false --ignore-scripts --legacy-peer-deps --no-audit --no-fund \
              "@deepseek-ai/cordis@${CORDIS_VERSION}" \
              "@deepseek-ai/cordis-plugin-loader@${LOADER_VERSION}" \
              "@deepseek-ai/cordis-plugin-timer@${TIMER_VERSION}" \
              "@deepseek-ai/dsh-session@${RUNTIME_VERSION}" \
              "@deepseek-ai/dsh-session-query@${RUNTIME_VERSION}" \
              "@deepseek-ai/dsh-session-persistence-jsonl@${RUNTIME_VERSION}" \
              "@deepseek-ai/dsh-storage@${RUNTIME_VERSION}" \
              "@deepseek-ai/dsh-storage-json@${RUNTIME_VERSION}" \
              "@deepseek-ai/dsh-storage-domain@${RUNTIME_VERSION}" \
              "@deepseek-ai/dsh-workspace@${RUNTIME_VERSION}" \
              "@deepseek-ai/dsh-host-webserver@${RUNTIME_VERSION}" \
              "@deepseek-ai/dsh-settings@${RUNTIME_VERSION}" \
              ${SETTINGS_FILE_PACKAGE} \
              "@deepseek-ai/dsh-llm@${RUNTIME_VERSION}" \
              "@deepseek-ai/dsh-brand@${RUNTIME_VERSION}" \
              "@deepseek-ai/dsh-scope@${RUNTIME_VERSION}" \
              "@deepseek-ai/dsh-invariants@${RUNTIME_VERSION}" \
              "@deepseek-ai/dsh-typert-protocol@${RUNTIME_VERSION}" \
              "@deepseek-ai/dsh-session-title@${RUNTIME_VERSION}" \
              "@deepseek-ai/dsh-session-persistence@${RUNTIME_VERSION}" \
              "@deepseek-ai/dsh-session-projection@${RUNTIME_VERSION}" \
              "@deepseek-ai/dsh-home-paths@${RUNTIME_VERSION}" \
              "@deepseek-ai/dsh-atomic-write@${RUNTIME_VERSION}" \
              "@deepseek-ai/dsh-timeout@${RUNTIME_VERSION}" \
              "@deepseek-ai/dsh-attachment@${RUNTIME_VERSION}" 2>&1 | tee "$install_log"; then
              install_ok=true
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              break
            fi
            rm -rf "$runtime/node_modules" "$runtime/package-lock.json"
            sleep $((attempt * 5))
          done

          # Narrow upstream-gap allowance, the 0.2.1 line only (0.2.1-alpha.2 and
          # 0.2.1-rc.1): upstream has never published @deepseek-ai/dsh-invariants
          # at any 0.2.1 version to npm, so those matrix lines cannot install
          # their Cordis runtime and the real smoke test cannot run. The allowance
          # is deliberately strict: the runtime must be one of the two versions
          # listed below, the install must have failed with "npm error code
          # ETARGET" naming exactly that one dependency, and the registry must
          # still confirm it is missing. Every other runtime version, every other
          # missing package and every other install failure stays a hard gate (no
          # continue-on-error). The moment upstream publishes the package this
          # branch stops matching: the install succeeds and the full smoke test
          # runs again.
          if [ "$install_ok" != true ]; then
            missing="$(grep -oE 'No matching version found for [^ ]+' "$install_log" | sed -e 's/^No matching version found for //' -e 's/[.]$//' | sort -u || true)"
            expected_missing="@deepseek-ai/dsh-invariants@${RUNTIME_VERSION}"
            case "$RUNTIME_VERSION" in
              0.2.1-alpha.2 | 0.2.1-rc.1) gap_allowed=true ;;
              *) gap_allowed=false ;;
            esac
            if [ "$gap_allowed" = true ] \
              && [ "$missing" = "$expected_missing" ] \
              && grep -q 'npm error code ETARGET' "$install_log"; then
              # Absence must be proven by the registry itself, never inferred from
              # "some npm command failed": a network outage, an auth failure or a
              # 5xx would otherwise look exactly like a missing package. Query the
              # registry explicitly, keep npm's JSON envelope, and accept only the
              # registry's own E404 absence code on a non-zero exit. A successful
              # query (the package now exists) or any other error stays a hard gate.
              probe_json="$RUNNER_TEMP/dsh-registry-probe.json"
              probe_stderr="$RUNNER_TEMP/dsh-registry-probe.stderr"
              probe_status=0
              set +e
              npm view "$expected_missing" version --json >"$probe_json" 2>"$probe_stderr"
              probe_status=$?
              set -e
              probe_code="$(node -e 'const fs=require("node:fs");let c="unparsed";try{const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));c=(p&&p.error&&typeof p.error.code==="string")?p.error.code:"resolved";}catch{c="unparsed";}process.stdout.write(c);' "$probe_json" 2>/dev/null || true)"
              probe_code="${probe_code:-unparsed}"
              if [ "$probe_status" -eq 0 ] || [ "$probe_code" != "E404" ]; then
                # Not a proven upstream gap: the hard gate stands.
                echo "registry probe for $expected_missing returned exit=$probe_status code=$probe_code; expected a non-zero exit carrying error.code E404" >&2
              else
                echo "registry probe for $expected_missing confirmed absence (npm view error.code E404, exit=$probe_status)"
                echo "smoke_skipped=true" >> "$GITHUB_OUTPUT"
                echo "::warning title=DSH $RUNTIME_VERSION Cordis smoke skipped::Upstream @deepseek-ai/dsh-invariants@$RUNTIME_VERSION is absent from the npm registry, so this matrix line could not install its Cordis runtime and its smoke test was SKIPPED, not passed."
                {
                  echo "### DSH $RUNTIME_VERSION (Node $(node --version)): Cordis smoke skipped"
                  echo ""
                  echo "- Upstream dependency @deepseek-ai/dsh-invariants@$RUNTIME_VERSION is absent from the npm registry (npm error code ETARGET), so the exact-runtime install could not complete."
                  echo "- npm run test:runtime was SKIPPED for this matrix line. This is not a pass and says nothing about plugin behaviour on $RUNTIME_VERSION."
                  echo "- The allowance covers only @deepseek-ai/dsh-invariants at the two 0.2.1 versions (0.2.1-alpha.2, 0.2.1-rc.1); all other runtime lines remain hard gates."
                  echo "- Once upstream publishes the package this install succeeds and the full smoke test runs automatically."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            echo "DSH runtime installation failed after 3 attempts" >&2
            exit 1
          fi
          echo "DSH_RUNTIME_ROOT=$runtime" >> "$GITHUB_ENV"
          echo "DSH_RUNTIME_VERSION=$RUNTIME_VERSION" >> "$GITHUB_ENV"
          echo "DSH_REQUIRE_RUNTIME_SMOKE=1" >> "$GITHUB_ENV"
      - name: Run real Cordis smoke test
        # Skipped only when the step above proved the 0.2.1-line upstream gap
        # (0.2.1-alpha.2 or 0.2.1-rc.1); every other runtime line always runs
        # this smoke test.
        if: steps.runtime-install.outputs.smoke_skipped != 'true'
        run: npm run test:runtime
